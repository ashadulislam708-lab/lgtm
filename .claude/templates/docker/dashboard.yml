# META: volumes=[]
  $DASHBOARD_NAME:
    build:
      context: ./$DASHBOARD_NAME
      dockerfile: Dockerfile
    container_name: $PROJECT_NAME-$DASHBOARD_NAME
    restart: unless-stopped
    ports:
      - '$DASHBOARD_PORT:5173'
    volumes:
      - ./$DASHBOARD_NAME/src:/app/src
    networks:
      - $PROJECT_NAME-network
