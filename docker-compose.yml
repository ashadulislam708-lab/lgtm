version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgtm-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-lgtm}
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=orderflow-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lgtm-network

  postgres:
    image: postgres:16-alpine
    container_name: lgtm-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=${DATABASE_NAME:-lgtm}
      - POSTGRES_USER=${DATABASE_USER:-postgres}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgtm-network

  redis:
    image: redis:7-alpine
    container_name: lgtm-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgtm-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: lgtm-otel-collector
    restart: unless-stopped
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    networks:
      - lgtm-network
    depends_on:
      - tempo
      - loki
      - mimir

  grafana:
    image: grafana/grafana:latest
    container_name: lgtm-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - lgtm-network

  tempo:
    image: grafana/tempo:latest
    container_name: lgtm-tempo
    restart: unless-stopped
    ports:
      - '3200:3200'
      - '4320:4317'
    volumes:
      - ./tempo-config.yaml:/etc/tempo/config.yaml
      - tempo-data:/var/tempo
    command: ['-config.file=/etc/tempo/config.yaml']
    networks:
      - lgtm-network

  loki:
    image: grafana/loki:latest
    container_name: lgtm-loki
    restart: unless-stopped
    ports:
      - '3100:3100'
    volumes:
      - loki-data:/loki
    networks:
      - lgtm-network

  mimir:
    image: grafana/mimir:latest
    container_name: lgtm-mimir
    restart: unless-stopped
    ports:
      - '9009:9009'
    volumes:
      - mimir-data:/data
    command: ['-config.file=/etc/mimir/config.yaml', '-target=all']
    networks:
      - lgtm-network

volumes:
  postgres-data:
  redis-data:
  grafana-data:
  tempo-data:
  loki-data:
  mimir-data:

networks:
  lgtm-network:
    driver: bridge
