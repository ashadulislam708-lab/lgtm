services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgtm-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=lgtm-backend
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    networks:
      - lgtm-network

  postgres:
    image: postgres:16-alpine
    container_name: lgtm-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-lgtm}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgtm-network

  redis:
    image: redis:7-alpine
    container_name: lgtm-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgtm-network

  mimir:
    image: grafana/mimir:2.14.0
    container_name: lgtm-mimir
    restart: unless-stopped
    command: ['--config.file=/etc/mimir/mimir.yaml']
    ports:
      - '9009:9009'
    volumes:
      - ./infra/mimir/mimir.yaml:/etc/mimir/mimir.yaml:ro
      - mimir-data:/data/mimir
    networks:
      - lgtm-network

  tempo:
    image: grafana/tempo:2.6.1
    container_name: lgtm-tempo
    restart: unless-stopped
    command: ['-config.file=/etc/tempo/config.yml']
    volumes:
      - ./infra/tempo/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - '3200:3200'
    networks:
      - lgtm-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: lgtm-otel-collector
    restart: unless-stopped
    command: ['--config=/etc/otel-collector-config.yml']
    ports:
      - '4317:4317'
      - '4318:4318'
    volumes:
      - ./infra/otel-collector/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    depends_on:
      - loki
      - mimir
      - tempo
    networks:
      - lgtm-network

  loki:
    image: grafana/loki:3.4.2
    container_name: lgtm-loki
    restart: unless-stopped
    user: '0'
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lgtm-network

  grafana:
    image: grafana/grafana:11.6.0
    container_name: lgtm-grafana
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
      mimir:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - lgtm-network

volumes:
  postgres-data:
  redis-data:
  loki-data:
  mimir-data:
  tempo-data:
  grafana-data:

networks:
  lgtm-network:
    driver: bridge
