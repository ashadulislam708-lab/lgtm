services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lgtm-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lgtm-network

  postgres:
    image: postgres:16-alpine
    container_name: lgtm-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-lgtm}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgtm-network

  redis:
    image: redis:7-alpine
    container_name: lgtm-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgtm-network

volumes:
  postgres-data:
  redis-data:

networks:
  lgtm-network:
    driver: bridge
